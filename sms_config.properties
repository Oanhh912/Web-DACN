# ==============================================================================
# CẤU HÌNH GỬI TIN NHẮN SMS THỰC TẾ VỀ SỐ ĐIỆN THOẠI NGƯỜI DÙNG (SMS GATEWAY)
# ==============================================================================
# Lưu ý: Ứng dụng web không thể tự phát sóng đến điện thoại nếu không qua Cổng dịch vụ
# viễn thông (SMS Gateway). Bạn có thể đăng ký tài khoản Twilio (miễn phí $15 thử nghiệm)
# hoặc SpeedSMS / eSMS tại Việt Nam để gửi tin nhắn thật đến SIM điện thoại.
# ==============================================================================

# Nhà cung cấp SMS đang dùng: TWILIO hoặc SPEEDSMS hoặc ESMS
SMS_PROVIDER=TWILIO

# ------------------------------------------------------------------------------
# 1. CẤU HÌNH TWILIO (Khuyên dùng - https://www.twilio.com)
#    - Đăng ký tài khoản miễn phí tại Twilio (tặng $15 số dư trải nghiệm)
#    - Nhập 3 thông số từ Dashboard vào bên dưới:
# ------------------------------------------------------------------------------
TWILIO_ACCOUNT_SID=your_account_sid_here
TWILIO_AUTH_TOKEN=your_auth_token_here
TWILIO_PHONE_NUMBER=+1xxxxxxxxxx

# ------------------------------------------------------------------------------
# 2. CẤU HÌNH SPEEDSMS (Dịch vụ SMS tại Việt Nam - https://speedsms.vn)
# ------------------------------------------------------------------------------
SPEEDSMS_ACCESS_TOKEN=your_speedsms_access_token_here

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH ESMS (Dịch vụ eSMS tại Việt Nam - https://esms.vn)
# ------------------------------------------------------------------------------
ESMS_API_KEY=your_esms_api_key_here
ESMS_SECRET_KEY=your_esms_secret_key_here
